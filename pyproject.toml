[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seclab-verification-tool"
version = "0.1.0"
description = "Specification-driven software verification tool"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "z3-solver>=4.12,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
gui = ["PySide6>=6.7,<7"]
xlsx = ["openpyxl>=3.1,<4"]

[project.scripts]
seclab-workbench = "seclab.gui.app:main"
seclab = "seclab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
